<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CaseStudy của Tuấn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <img style="height: 200px" src="//theme.hstatic.net/1000375557/1001056558/14/logo.png?v=409">
    <style>
        h1{
            padding-bottom:50px;
        }

    </style>
</head>
<body class="card">
<h1 style="text-align: center;" class="text-danger" > Bảng kiểm kê số lượng vật tư tháng 8/2024</h1>
<input class="input-group-text" type="text"  id="Code" placeholder="Nhập mã vật tư ">
<input class="input-group-text" type="text"  id="Name" placeholder="Nhập tên vật tư  ">
<input class="input-group-text" type="text"  id="index" hidden="hidden" >
<input class="input-group-text" type="text"  id="Unit" placeholder="Nhập đơn vị tính ">
<input class="input-group-text" type="number"  id="Quantity" placeholder="Nhập số lượng ">
<button class="btn btn-outline-success" onclick="Add()">Nhập</button>
<button class="btn btn-outline-primary" onclick="Update()">Cập nhật</button>
<h3 class="text-primary"> Danh sách vật tư </h3>
<p class="fw-bolder" > Tổng các đầu mục :  <span id="total"></span></p>
    <table  class="table table-striped-columns "  >
    <thead>
    <tr>
        <th style="text-align: center;">Mã Vật Tư</th>
        <th style="text-align: center;">Tên Vật Tư</th>
        <th style="text-align: center;">Đơn vị tính</th>
        <th style="text-align: center;">Số lượng</th>
        <th colspan="2"  style="text-align: center;">Action</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>

</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
<script>
    class Materials{
        constructor(code ,name,unit,quantity) {

            this.code = code
            this.name = name
            this.unit=unit
            this.quantity=quantity
        }
        setCode(code){
            this.code=code
        }
        getCode(){
            return this.code
        }
        setName(name){
            this.name=name
        }
        getName(){
            return this.name
        }
        setUnit(unit){
            this.unit=unit
        }
        getUnit(){
            return this.unit
        }
        setQuantity(quantity){
            this.quantity=quantity
        }
        getQuantity(){
            return this.quantity
        }
    }
    let Materials1=new Materials("T01","Ống đồng","Chiếc",100)
    let Materials2=new Materials("T02","Thép D6","kg",1500)
    let Materials3=new Materials("T03","Thép D8","kg",12000)
    let Materials4=new Materials("T04","Thép D10","kg",1100)
    let Materials5=new Materials("T05","Thép D12","kg",1300)
    let Materials6=new Materials("T06","Cát vàng","m3",200)
    let Materials7=new Materials("T07","Cát xây","m3",500)
    let Materials8=new Materials("T08","Gạch A1","viên",10000)
    let Materials9=new Materials("T09","Gạch A2","viên",800)
    let Materials10=new Materials("T010","Xi măng 30pcb","kg",400)
    let Materials11=new Materials("T011","Xi măng 60pcb","kg",300)
    let Materials12=new Materials("T012","Đinh","kg",10)
    let Materials13=new Materials("T013","Que hàn","kg",15)

    let array = [Materials1,Materials2,Materials3,Materials4,Materials5,Materials6,Materials7
        ,Materials8,Materials9,Materials10,Materials11,Materials12,Materials13]
    function displayProduct(arr){
        let str = ""
        for (let i = 0; i < arr.length; i++) {
            str += "<tr>" +
                "<td>" + arr[i].getCode() + "</td>"+
                "<td>" + arr[i].getName() + "</td>"+
                "<td>" + arr[i].getUnit() + "</td>"+
                "<td>" + arr[i].getQuantity() + "</td>"+
                "<td>" +
                "<button class='btn btn-primary btn-lg' style='text-align: center;' onclick='editVal("+ i +")'><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" fill=\"currentColor\" class=\"bi bi-pencil\" viewBox=\"0 0 16 16\">\n" +
                "  <path d=\"M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325\"/>\n" +
                "</svg></button>" +
                "</td>"+
                "<td>" +
                "<button class='btn btn-danger btn-lg' onclick='delVal("+ i +")'>" +
                "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" fill=\"currentColor\" class=\"bi bi-trash3\" viewBox=\"0 0 16 16\">\n" +
                "  <path d=\"M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5\"/>\n" +
                "</svg></button>" +
                "</td>" +
                "</tr>";
        }
        document.getElementById('tbody').innerHTML=str
        document.getElementById('total').innerHTML=arr.length
    }
    displayProduct(array)
    function Add(){
        let productCode = document.getElementById('Code').value;
        let productName = document.getElementById('Name').value;
        let productUnit = document.getElementById('Unit').value;
        let productStyle = document.getElementById('Quantity').value;
        let materials = new Materials(productCode,productName,productUnit,productStyle);
        array.push(materials )
        document.getElementById('Code').value=""
        document.getElementById('Name').value=""
        document.getElementById('Unit').value=""
        document.getElementById('Quantity').value=""
        alert('Thêm thành công vật tư')
        displayProduct(array)
    }
    function delVal(i){
        let check =confirm('Bạn có chắc là muốn xoá ' + array[i].getName() + " không ?")
        if(check){
            array.splice(i,1);
            alert("Xoá vật tư thành công")
        }

        displayProduct(array)
    }
    function editVal(i){
        document.getElementById('Code').value=array[i].getCode()
        document.getElementById('Name').value=array[i].getName()
        document.getElementById('Unit').value=array[i].getUnit()
        document.getElementById('Quantity').value=array[i].getQuantity()
        document.getElementById('index').value=i
    }

    function Update(){
        let newCode=document.getElementById('Code').value
        let newName=document.getElementById('Name').value
        let newUnit=document.getElementById('Unit').value
        let newQuantity=document.getElementById('Quantity').value
        let index=document.getElementById('index').value
        array[index].setCode(newCode)
        array[index].setName(newName)
        array[index].setUnit(newUnit)
        array[index].setQuantity(newQuantity)
        document.getElementById('Code').value=""
        document.getElementById('Name').value=""
        document.getElementById('Unit').value=""
        document.getElementById('Quantity').value=""
        alert('Cập nhật số liệu vật tư thành công')
        displayProduct(array)
    }
    displayProduct(array)
</script>

</body>
</html>
