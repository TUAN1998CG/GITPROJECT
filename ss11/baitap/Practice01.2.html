<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let temp = +prompt('Nhập nhiệt độ vào đây');
    while (temp > 100 || temp < 20) {
        if (temp > 100) {
            alert('Giảm nhiệt độ')
            temp = +prompt('Nhập nhiệt độ')
        } else if (temp < 20) {
            alert('Tăng nhiệt độ')
            temp = +prompt('Nhập nhiệt độ')

        }
    }


</script>
</body>
</html>
