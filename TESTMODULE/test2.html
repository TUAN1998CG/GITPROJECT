<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let score=+prompt('Nhập điểm số của bạn vào')
    if(score<50){
        alert('Không đủ điều kiện')
    }else{
function lamTron(score){
    let boiSoCua5=Math.ceil(score/5)*5
    if(boiSoCua5-score<3){
        if(boiSoCua5>=50)
            return boiSoCua5
    }else {
        return score
    }
}
    }
    let  lamTronDien=lamTron(score)
    alert("Điểm số của bạn sau làm tròn là: " + lamTronDien)


</script>

</body>
</html>
