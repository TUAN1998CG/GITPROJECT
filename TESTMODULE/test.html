<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let array = []
    let count = 0
    for (let i = 0; i < 20; i++) {
        array[i] = +prompt('Nhập giá trị vào mảng')
        if (array[i] % 3 === 0 && array[i] % 5 === 0) {
            count += array[i]
        }
    }
    document.write('Mảng gồm các phần tử '+ array + "<br>")

   document.write("Tổng các số là bội của 3 và 5 là: " + count)

</script>

</body>
</html>
